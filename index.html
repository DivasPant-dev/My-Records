<style>
/* Layout: one sticky command bar (search, type tabs, tags) above a responsive card grid.
   One floating "New" button. Editors and viewers open as bottom sheets on phones, centered panels on desktop. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface2:#e8eeec; --ink:#14201d; --muted:#54665f; --line:#d3dcd9;
  --accent:#0b6e63; --accent-ink:#ffffff; --accent-soft:#d5ede9; --star:#b86e00; --danger:#b3261e;
  --scrim:rgba(8,16,14,.5); --shadow:0 1px 2px rgba(10,30,26,.08),0 8px 20px rgba(10,30,26,.06);
  --font-display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1514; --surface:#152120; --surface2:#1c2c2a; --ink:#e6efed; --muted:#9bb0aa; --line:#293a37;
    --accent:#4fd1c0; --accent-ink:#05201c; --accent-soft:#123a35; --star:#f2b84b; --danger:#ff8f85;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#152120; --surface2:#1c2c2a; --ink:#e6efed; --muted:#9bb0aa; --line:#293a37;
  --accent:#4fd1c0; --accent-ink:#05201c; --accent-soft:#123a35; --star:#f2b84b; --danger:#ff8f85;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  font:15px/1.5 var(--font-body); background:var(--bg); color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
#app{max-width:1100px;margin:0 auto}

/* command bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.45rem;line-height:1.1;letter-spacing:-.01em}
.brand .sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.78rem;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.dot.warn{background:var(--star)} .dot.bad{background:var(--danger)}
.bar-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.on{color:var(--star)}
.search{position:relative}
.search .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;pointer-events:none}
.search input{width:100%;min-height:46px;padding:0 14px 0 44px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar,.tagrow::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.tab .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.85}
.tagrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tagchip{flex:none;min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.82rem;color:var(--muted)}
.tagchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;color:var(--muted);font-size:.85rem}

.card .kind{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card h3{font-size:1.02rem;line-height:1.3;padding-right:44px;overflow-wrap:anywhere}

.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.78rem;padding-top:4px}
.pill{border-radius:6px;background:var(--surface2);padding:2px 8px;font-size:.74rem;color:var(--muted)}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.card .star{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.card .star.on{color:var(--star)}

.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1.5px dashed var(--line);border-radius:18px;background:var(--surface)}
.empty h2{font-size:1.2rem;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:42ch}
.empty .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.92rem}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn[disabled]{opacity:.55;cursor:default}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;min-height:56px;padding:0 22px 0 18px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.fab:hover{filter:brightness(1.08)}

/* panels */
#overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}

@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:760px){#overlay{align-items:center}.panel{border-radius:22px;max-height:calc(100dvh - 48px)}}
.p-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:flex-start;gap:8px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.p-head .t{flex:1;min-width:0}
.p-head h2{font-size:1.25rem;line-height:1.25;overflow-wrap:anywhere}
.p-head .meta{color:var(--muted);font-size:.8rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.p-body{padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.p-foot{position:sticky;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field textarea,.pin input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.field textarea{min-height:76px;line-height:1.45}
.hint{color:var(--muted);font-size:.82rem;margin:0}
.qa-rows{display:flex;flex-direction:column;gap:12px}
.qa-row{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.qa-row .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qa-row .rh span{font-family:var(--font-display);font-weight:600;font-size:.85rem;color:var(--accent)}
.qa-row textarea{background:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.q-item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q-item .qn{font-family:var(--font-display);font-weight:600;font-size:.8rem;color:var(--accent)}
.q-item .q{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.q-item .a{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.q-item .reveal{align-self:flex-start;min-height:38px;padding:0 14px;border-radius:10px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;cursor:pointer}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.choose{grid-template-columns:1fr}}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .oi{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.opt b{font-family:var(--font-display);font-size:1.02rem}
.opt span.d{color:var(--muted);font-size:.86rem}
.imgwrap{background:var(--surface2);border-radius:14px;overflow:auto;max-height:64vh;max-height:64dvh;display:grid;place-items:center}
.imgwrap img{display:block;max-width:100%;max-height:64vh;max-height:64dvh;object-fit:contain}
.imgwrap.zoom img{max-width:none;max-height:none;width:220%}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.setting{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.setting h3{font-size:1rem}
.pin{display:flex;flex-direction:column;gap:8px}
.pwrow{display:flex;gap:8px;align-items:stretch}
.pwrow input{flex:1;min-width:0}
.meter{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.meter .bar2{flex:1;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter .bar2 i{display:block;height:100%;width:0;border-radius:4px;background:var(--danger);transition:width .2s}
.rcode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.1rem;letter-spacing:.05em;text-align:center;padding:14px 10px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft);overflow-wrap:anywhere;user-select:all}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.dialog .tools{justify-content:center}

/* dialogs, lock, toast */
#confirm{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:min(420px,100%);background:var(--surface);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog h3{font-size:1.1rem}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:min(340px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.lockbox .mark{margin:0 auto;width:56px;height:56px;border-radius:16px}
.lockbox .field{text-align:left}
.err{color:var(--danger);font-size:.88rem;min-height:1.3em;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:min(92vw,420px);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.panel,.skel{animation:none}#toast{transition:none}}
</style>

<div id="app">
  <header class="top">
    <div class="bar">
      <div class="brand">
        <span class="mark" id="mark"></span>
        <div style="min-width:0">
          <h1>My Records</h1>
          <div class="sub"><span id="dot" class="dot warn"></span><span id="status">Getting ready</span></div>
        </div>
      </div>
      <div class="bar-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
        <button id="menuBtn" class="icon-btn" type="button" aria-label="Backup and password settings"></button>
      </div>
    </div>
    <div class="search">
      <span class="s-ic" id="sIc"></span>
      <input id="q" type="search" placeholder="Search titles, questions, notes, tags" autocomplete="off" aria-label="Search your records">
    </div>
    <div id="tabs" class="tabs" role="group" aria-label="Filter by type"></div>
    <div id="tags" class="tagrow" role="group" aria-label="Filter by tag" hidden></div>
  </header>
  <main>
    <div class="listhead">
      <span id="count" aria-live="polite"></span>
      <label>Sort
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">A to Z</option>
        </select>
      </label>
    </div>
    <div id="list" class="grid" aria-busy="true"></div>
  </main>
  <button id="fab" class="fab" type="button"></button>
</div>
<div id="overlay" hidden></div>
<div id="confirm" hidden></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
function errMsg(e){
  var c = e && e.code;
  if (c === 'quota_exceeded') return 'Your storage is full. Delete something and try again.';
  if (c === 'invalid_argument') return 'That record is too large to save. Try a smaller image or a shorter sheet.';
  return "Couldn't save. Check your connection and try again.";
}
function normalize(r){
  if (!r || typeof r !== 'object') return null;
  var type = r.type === 'image' ? 'image' : (r.type === 'qa' ? 'qa' : null);
  if (!type) return null;
  var o = {
    id: (typeof r.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(r.id)) ? r.id : newId(),
    type: type,
    title: str(r.title, 120) || 'Untitled',
    tags: Array.isArray(r.tags) ? r.tags.filter(function(t){ return typeof t === 'string' && t; }).slice(0, 8).map(function(t){ return t.slice(0, 24); }) : [],
    fav: !!r.fav,
    created: Number(r.created) || Date.now(),
    updated: Number(r.updated) || Number(r.created) || Date.now()
  };
  if (type === 'qa') {
    o.pairs = (Array.isArray(r.pairs) ? r.pairs : []).slice(0, 300).map(function(p){
      return {q: str(p && p.q, 4000), a: str(p && p.a, 4000)};
    }).filter(function(p){ return p.q || p.a; });
  } else {
    o.note = str(r.note, 4000);
    o.image = (typeof r.image === 'string' && r.image.indexOf('data:image/') === 0) ? r.image : '';
    if (!o.image) return null;
  }
  return o;
}
function dataUrlToBlob(u){
  var i = u.indexOf(','), meta = u.slice(5, i), mime = meta.split(';')[0] || 'image/jpeg';
  var bin = atob(u.slice(i + 1)), arr = new Uint8Array(bin.length);
  for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], {type: mime});
}

/* ---------- password vault (end-to-end encryption) ---------- */
var VAULT = {key: null};
var te = new TextEncoder(), td = new TextDecoder();
var seq = 0, hiddenAt = 0;
var lockEl = $('#lock');
function cryptoOk(){ return !!(window.crypto && crypto.subtle && window.TextEncoder); }
function limit(){ return VAULT.key ? Math.floor(store.maxChars * 0.7) : store.maxChars; }
function b64e(buf){
  var b = new Uint8Array(buf), out = '', n = 0x8000;
  for (var i = 0; i < b.length; i += n) out += String.fromCharCode.apply(null, b.subarray(i, i + n));
  return btoa(out);
}
function b64d(x){
  var bin = atob(x), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }
var CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeCode(){
  var b = rnd(24), c = '';
  for (var i = 0; i < 24; i++) { c += CODE_ALPHABET[b[i] & 31]; if (i % 4 === 3 && i < 23) c += '-'; }
  return c;
}
function normCode(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
async function kek(secret, saltB64, iter){
  var base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b64d(saltB64), iterations: iter}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function wrapKey(k, raw){
  var iv = rnd(12), ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, k, raw));
  var out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return b64e(out);
}
async function unwrapKey(k, b64){
  var a = b64d(b64);
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: a.slice(0, 12)}, k, a.slice(12)));
}
function dekFrom(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']); }
async function newVault(password){
  var raw = rnd(32), iter = 600000, recIter = 100000, salt = b64e(rnd(16)), recSalt = b64e(rnd(16)), code = makeCode();
  var kPw = await kek(password, salt, iter), kRec = await kek(normCode(code), recSalt, recIter);
  var meta = {v: 1, iter: iter, salt: salt, wrapPw: await wrapKey(kPw, raw), recIter: recIter, recSalt: recSalt, wrapRec: await wrapKey(kRec, raw)};
  return {meta: meta, raw: raw, code: code};
}
async function openWithPassword(meta, password){ return unwrapKey(await kek(password, meta.salt, meta.iter), meta.wrapPw); }
async function openWithCode(meta, code){ return unwrapKey(await kek(normCode(code), meta.recSalt, meta.recIter), meta.wrapRec); }
async function rewrapPassword(meta, raw, password){
  var salt = b64e(rnd(16)), k = await kek(password, salt, meta.iter);
  return Object.assign({}, meta, {salt: salt, wrapPw: await wrapKey(k, raw)});
}
async function rewrapCode(meta, raw){
  var code = makeCode(), salt = b64e(rnd(16)), k = await kek(normCode(code), salt, meta.recIter);
  return {meta: Object.assign({}, meta, {recSalt: salt, wrapRec: await wrapKey(k, raw)}), code: code};
}
async function openRow(row){
  var a = b64d(row.enc);
  var pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: a.slice(0, 12), additionalData: te.encode(row.id)}, VAULT.key, a.slice(12));
  return JSON.parse(td.decode(pt));
}
async function sealRec(rec){
  var iv = rnd(12);
  var ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv, additionalData: te.encode(rec.id)}, VAULT.key, te.encode(JSON.stringify(rec))));
  var out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return {id: rec.id, v: 1, updated: rec.updated, enc: b64e(out)};
}
async function putRec(rec){
  if (!VAULT.key) return store.put(rec);
  var env = await sealRec(rec);
  if (store.kind === 'account' && JSON.stringify(env).length > 250000) {
    if (rec.type === 'image') {
      try { var r2 = clone(rec); r2.image = shrink(await loadImg(rec.image), 100000); env = await sealRec(r2); } catch (e) {}
    }
    if (JSON.stringify(env).length > 250000) { var er = new Error('big'); er.code = 'invalid_argument'; throw er; }
  }
  return store.put(env);
}
async function processRaw(){
  if (!S.rawReady) return;
  var my = ++seq, rows = S.raw || [], out = [], bad = 0, needs = false;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    try {
      if (row && row.enc) {
        if (!VAULT.key) { needs = true; continue; }
        var n1 = normalize(await openRow(row)); if (n1) out.push(n1);
      } else { var n2 = normalize(row); if (n2) out.push(n2); }
    } catch (e) { bad++; }
  }
  if (my !== seq) return;
  S.records = out; S.bad = bad; S.needReload = needs;
  S.loaded = true; S.failed = false; S.slow = false;
  clearTimeout(loadTimer); setStatus(); renderAll();
}

/* ---------- storage ---------- */
function dbStore(db, uid){
  var profile = db.doc('data/users/' + uid + '/profile'), col = profile.collection('records');
  return {
    kind: 'account', maxChars: 185000, maxDim: 1280,
    subscribe: function(cb, err){
      return col.onSnapshot(function(snap){ cb(snap.docs.map(function(d){ return d.data(); })); }, err);
    },
    put: function(rec){ return col.doc(rec.id).set(rec); },
    remove: function(id){ return col.doc(id).delete(); },
    getMeta: function(){ return profile.get().then(function(sn){ var d = sn.exists ? sn.data() : null; return (d && d.vault) || null; }); },
    setMeta: function(m){ return profile.set({vault: m}); },
    clearMeta: function(){ return profile.set({vault: null}); }
  };
}
function localStore(){
  var dbp = null, listener = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var r = indexedDB.open('my-records', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('records', {keyPath: 'id'}); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction('records', mode), out = fn(t.objectStore('records'));
        t.oncomplete = function(){ res(out && out.result); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  function refresh(){
    return tx('readonly', function(st){ return st.getAll(); }).then(function(rows){ if (listener) listener(rows || []); });
  }
  return {
    kind: 'local', maxChars: 900000, maxDim: 1600,
    ready: open,
    subscribe: function(cb, err){ listener = cb; refresh().catch(err); },
    put: function(rec){ return tx('readwrite', function(st){ return st.put(rec); }).then(refresh); },
    remove: function(id){ return tx('readwrite', function(st){ return st.delete(id); }).then(refresh); },
    getMeta: function(){
      try { var v = localStorage.getItem('mr_vault'); return Promise.resolve(v ? JSON.parse(v) : null); } catch (e) { return Promise.resolve(null); }
    },
    setMeta: function(m){
      try { localStorage.setItem('mr_vault', JSON.stringify(m)); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
    },
    clearMeta: function(){ try { localStorage.removeItem('mr_vault'); } catch (e) {} return Promise.resolve(); }
  };
}
function memStore(){
  var rows = [], listener = null;
  function push(){ if (listener) listener(rows.slice()); return Promise.resolve(); }
  return {
    kind: 'memory', maxChars: 600000, maxDim: 1400,
    subscribe: function(cb){ listener = cb; push(); },
    put: function(rec){ rows = rows.filter(function(r){ return r.id !== rec.id; }); rows.push(clone(rec)); return push(); },
    remove: function(id){ rows = rows.filter(function(r){ return r.id !== id; }); return push(); },
    _meta: null,
    getMeta: function(){ return Promise.resolve(this._meta); },
    setMeta: function(m){ this._meta = m; return Promise.resolve(); },
    clearMeta: function(){ this._meta = null; return Promise.resolve(); }
  };
}
function timeout(ms){ return new Promise(function(r){ setTimeout(function(){ r('timeout'); }, ms); }); }
async function initStore(){
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      var res = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout(6000)]);
      if (res !== 'timeout') {
        var uid = res[1] ? await res[1].id() : null;
        if (res[0] && uid) return dbStore(res[0], uid);
      }
    } catch (e) {}
  }
  try {
    if (window.indexedDB) { var ls = localStore(); await ls.ready(); return ls; }
  } catch (e) {}
  return memStore();
}

/* ---------- state ---------- */
var S = {records: [], loaded: false, failed: false, tab: 'all', tag: '', q: '', sort: 'new', dirty: false, opener: null, slow: false,
  raw: [], rawReady: false, vault: null, locked: false, metaReady: false, bad: 0, needReload: false, fails: 0};
var store = null, DL = null, loadTimer = null;

var listEl = $('#list'), tabsEl = $('#tabs'), tagsEl = $('#tags'), overlay = $('#overlay');

function setStatus(){
  var dot = $('#dot'), st = $('#status');
  dot.className = 'dot';
  if (S.failed) { dot.classList.add('bad'); st.textContent = "Can't reach your account right now"; return; }
  if (!store) { dot.classList.add('warn'); st.textContent = 'Getting ready'; return; }
  if (store.kind === 'account') st.textContent = (S.vault ? 'Password protected' : 'Private to you') + ' · synced to your account';
  else if (store.kind === 'local') { dot.classList.add('warn'); st.textContent = (S.vault ? 'Password protected' : 'Private') + ' · saved on this device only'; }
  else { dot.classList.add('bad'); st.textContent = 'Not saved · this visit only'; }
}

/* ---------- list rendering ---------- */
function hay(r){
  var s = r.title + ' ' + (r.tags || []).join(' ') + ' ' + (r.note || '');
  if (r.pairs) r.pairs.forEach(function(p){ s += ' ' + p.q + ' ' + p.a; });
  return s.toLowerCase();
}
function visible(){
  var q = S.q.trim().toLowerCase();
  var rows = S.records.filter(function(r){
    if (S.tab === 'qa' && r.type !== 'qa') return false;
    if (S.tab === 'image' && r.type !== 'image') return false;
    if (S.tab === 'fav' && !r.fav) return false;
    if (S.tag && r.tags.indexOf(S.tag) < 0) return false;
    if (q && hay(r).indexOf(q) < 0) return false;
    return true;
  });
  rows.sort(function(a, b){
    if (S.sort === 'old') return a.created - b.created;
    if (S.sort === 'az') return a.title.localeCompare(b.title);
    return b.created - a.created;
  });
  return rows;
}
function renderTabs(){
  var c = {all: S.records.length, qa: 0, image: 0, fav: 0};
  S.records.forEach(function(r){ c[r.type]++; if (r.fav) c.fav++; });
  var defs = [['all', 'All'], ['qa', 'Q&A sheets'], ['image', 'Images'], ['fav', 'Favorites']];
  tabsEl.replaceChildren();
  defs.forEach(function(d){
    tabsEl.appendChild(h('button', {class: 'tab', type: 'button', 'aria-pressed': String(S.tab === d[0]),
      onclick: function(){ S.tab = d[0]; renderAll(); }}, d[1], h('span', {class: 'n', text: String(c[d[0]])})));
  });
}
function renderTags(){
  var seen = {};
  S.records.forEach(function(r){ r.tags.forEach(function(t){ seen[t] = 1; }); });
  var all = Object.keys(seen).sort();
  if (S.tag && !seen[S.tag]) S.tag = '';
  tagsEl.replaceChildren();
  tagsEl.hidden = all.length === 0;
  if (!all.length) return;
  tagsEl.appendChild(h('button', {class: 'tagchip', type: 'button', 'aria-pressed': String(!S.tag), onclick: function(){ S.tag = ''; renderAll(); }}, 'All tags'));
  all.forEach(function(t){
    tagsEl.appendChild(h('button', {class: 'tagchip', type: 'button', 'aria-pressed': String(S.tag === t),
      onclick: function(){ S.tag = (S.tag === t ? '' : t); renderAll(); }}, '#' + t));
  });
}
function card(r){
  var main = h('button', {class: 'card-main', type: 'button', 'aria-label': 'Open ' + r.title, onclick: function(e){ S.opener = e.currentTarget; viewRec(clone(r)); }});
  var body = h('div', {class: 'body'});
  if (r.type === 'image') {
    main.appendChild(h('img', {class: 'thumb', src: r.image, alt: r.title, decoding: 'async'}));
    body.appendChild(h('span', {class: 'kind'}, icon('image'), 'Image'));
    body.appendChild(h('h3', {text: r.title}));
    if (r.note) body.appendChild(h('div', {class: 'peek', text: r.note}));
  } else {
    body.appendChild(h('span', {class: 'kind'}, icon('list'), 'Q&A sheet'));
    body.appendChild(h('h3', {text: r.title}));
    var first = r.pairs[0];
    body.appendChild(h('div', {class: 'peek', text: first ? first.q || first.a : 'No questions yet'}));
  }
  var foot = h('div', {class: 'foot'});
  if (r.type === 'qa') foot.appendChild(h('span', {class: 'pill', text: r.pairs.length + (r.pairs.length === 1 ? ' question' : ' questions')}));
  r.tags.slice(0, 3).forEach(function(t){ foot.appendChild(h('span', {class: 'pill', text: '#' + t})); });
  foot.appendChild(h('span', {text: fmtDate(r.created)}));
  body.appendChild(foot);
  main.appendChild(body);
  var star = h('button', {class: 'star' + (r.fav ? ' on' : ''), type: 'button', 'aria-pressed': String(r.fav),
    'aria-label': r.fav ? 'Remove from favorites' : 'Add to favorites',
    onclick: function(){
      if (!store) return;
      var c = clone(r); c.fav = !c.fav;
      putRec(c).catch(function(e){ toast(errMsg(e)); });

function renderList(){

    if (S.failed && !S.records.length) {
      listEl.appendChild(h('div', {class: 'empty'}, h('h2', {text: "Can't load your records"}), h('p', {text: 'Check your connection, then reload this page.'})));
    } else if (!S.records.length) {

        h('h2', {text: 'Your records live here'}),

        h('div', {class: 'row'},

          h('button', {class: 'btn', type: 'button', onclick: function(e){ S.opener = e.currentTarget; editImage(null); }}, icon('image'), 'New image sheet'))));
    } else {
      listEl.appendChild(h('div', {class: 'empty'},
        h('h2', {text: 'Nothing matches'}),
        h('p', {text: 'Try a different word, or clear the filters.'}),
        h('div', {class: 'row'}, h('button', {class: 'btn', type: 'button', onclick: function(){
          S.q = ''; S.tag = ''; S.tab = 'all'; $('#q').value = ''; renderAll();

}
function renderAll(){ renderTabs(); renderTags(); renderList(); }

}

/* ---------- panels ---------- */
function closePanel(){
  overlay.hidden = true; overlay.replaceChildren(); S.dirty = false;
  document.body.classList.remove('noscroll');
  if (S.opener && document.body.contains(S.opener)) { try { S.opener.focus(); } catch (e) {} }
}
function openPanel(node, sticky){
  var p = h('div', {class: 'panel', role: 'dialog', 'aria-modal': 'true', tabindex: '-1'}, node);
  overlay.replaceChildren(p); overlay.hidden = false; overlay.dataset.sticky = sticky ? '1' : '';
  document.body.classList.add('noscroll'); S.dirty = false;
  p.scrollTop = 0; p.focus();

}
overlay.addEventListener('click', function(e){
  if (e.target === overlay && !overlay.dataset.sticky) closePanel();
});
function panelHead(title, meta, buttons){
  return h('div', {class: 'p-head'},
    h('div', {class: 't'}, h('h2', {text: title}), meta ? h('div', {class: 'meta'}, meta) : null),
    buttons);
}
function closeBtn(fn){

}

  var cancel = h('button', {class: 'btn', type: 'button', onclick: done}, opts.cancel || 'Cancel');

  var back = function(){ closePanel(); if (existing) viewRec(existing); };
  if (!S.dirty) { back(); return; }

}

  if (e.key !== 'Escape') return;
  if (!$('#confirm').hidden) { var cc = $('#confirm'), cb = cc._cancel; cc._cancel = null; cc.hidden = true; cc.replaceChildren(); if (cb) cb(); return; }
  if (!overlay.hidden && !S.dirty) closePanel();

/* ---------- Q&A ---------- */
function editQA(rec){
  if (!needStore()) return;
  var d = rec ? clone(rec) : {id: newId(), type: 'qa', title: '', tags: [], fav: false, created: Date.now(), pairs: [{q: '', a: ''}]};
  var rows = [], counter = 0;
  var title = h('input', {id: 'f-title', type: 'text', maxlength: '120', placeholder: 'e.g. Biology chapter 4', autocomplete: 'off'});
  title.value = d.title === 'Untitled' ? '' : d.title;
  var tags = h('input', {id: 'f-tags', type: 'text', placeholder: 'school, revision', autocomplete: 'off'});
  tags.value = d.tags.join(', ');
  var box = h('div', {class: 'qa-rows'});
  function autosize(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 420) + 'px'; }
  function renumber(){ rows.forEach(function(r, i){ r.label.textContent = 'Question ' + (i + 1); r.rm.setAttribute('aria-label', 'Remove question ' + (i + 1)); }); }
  function addRow(p, focus){
    if (rows.length >= 300) { toast('A sheet holds up to 300 questions.'); return; }
    var n = ++counter, o = {};
    o.label = h('span', {text: ''});
    o.rm = h('button', {class: 'icon-btn', type: 'button', onclick: function(){
      if (rows.length === 1) { o.q.value = ''; o.a.value = ''; autosize(o.q); autosize(o.a); return; }
      rows.splice(rows.indexOf(o), 1); o.el.remove(); renumber(); S.dirty = true;

function loadImg(src){
  return new Promise(function(res, rej){
    var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ rej(new Error('load')); }; im.src = src;
  });
}
function shrink(im, cap){
  var lim = cap || limit();
  var w0 = im.naturalWidth, h0 = im.naturalHeight;
  if (!w0 || !h0) throw new Error('size');
  var scale = Math.min(1, store.maxDim / Math.max(w0, h0)), q = 0.82, out = '';
  for (var i = 0; i < 12; i++) {
    var w = Math.max(1, Math.round(w0 * scale)), hh = Math.max(1, Math.round(h0 * scale));
    var c = document.createElement('canvas'); c.width = w; c.height = hh;
    var g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, hh); g.drawImage(im, 0, 0, w, hh);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= lim) return out;
    if (q > 0.5) q -= 0.1; else scale *= 0.85;
  }
  throw new Error('big');
}

}

function exportBackup(){
  if (!DL) { toast('Saving files is not available in this view.'); return; }
  var payload = JSON.stringify({app: 'My Records', version: 1, exported: new Date().toISOString(), records: S.records});
  var name = 'my-records-' + new Date().toISOString().slice(0, 10) + '.json';
  DL.save({filename: name, data: payload}).then(function(){ toast('Backup saved'); })
    .catch(function(e){ if (!e || e.code !== 'declined') toast("Couldn't save the backup here."); });
}
function importBackup(file){
  var rd = new FileReader();
  rd.onerror = function(){ toast("Couldn't read that file."); };
  rd.onload = async function(){
    var data;
    try { data = JSON.parse(rd.result); } catch (e) { toast("That file isn't a My Records backup."); return; }
    var list = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : null);
    if (!list) { toast("That file isn't a My Records backup."); return; }
    var ok = 0, skipped = 0;
    for (var i = 0; i < list.length; i++) {
      var r = normalize(list[i]);
      if (!r) { skipped++; continue; }
      try {
        if (r.type === 'image' && r.image.length > limit()) r.image = shrink(await loadImg(r.image));
        await putRec(r); ok++;
      } catch (e) { skipped++; }
    }
    toast(ok + ' restored' + (skipped ? ' · ' + skipped + ' skipped' : ''));
  };
  rd.readAsText(file);
}

          if (bad) { msg.textContent = bad + ' records could not be unlocked, so the password stays on.'; bOff.disabled = false; return; }
          await store.clearMeta(); S.vault = null; VAULT.key = null; setStatus(); toast('Password protection is off'); drawSec();
        } catch (e) { bOff.disabled = false; msg.textContent = "Couldn't turn it off. Try again."; }
      }});
    });
    sec.appendChild(cur.wrap);
    sec.appendChild(np2.wrap); sec.appendChild(meterFor(np2.input)); sec.appendChild(nc2.wrap);
    sec.appendChild(h('div', {class: 'tools'}, bChange, bCode, bOff, bLock));
    sec.appendChild(msg);
  }
  drawSec();
  openPanel(h('div', {}, panelHead('Backup and password', null, closeBtn()), h('div', {class: 'p-body'}, sec, backup)), false);
}

/* ---------- lock screens ---------- */
function finishUnlock(){
  S.locked = false; lockEl.hidden = true; lockEl.replaceChildren(); $('#app').hidden = false;
  setStatus(); processRaw();
}
function showUnlock(){
  closePanel(); $('#confirm').hidden = true; $('#app').hidden = true;
  var pw = pwField('lock-pw', 'Password', 'current-password');
  var err = h('p', {class: 'err', role: 'alert'});
  var go = h('button', {class: 'btn primary', type: 'submit'}, 'Unlock');
  var forgot = h('button', {class: 'btn', type: 'button', onclick: showRecover}, 'Forgot password?');
  var form = h('form', {class: 'lockbox'},
    h('span', {class: 'mark'}, icon('lock')), h('h1', {text: 'My Records'}),
    h('p', {class: 'hint', text: 'Enter your password to open your records.'}), pw.wrap, err, go, forgot);
  var until = 0;
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if (Date.now() < until || !pw.input.value) return;
    go.disabled = true; go.textContent = 'Unlocking...'; err.textContent = '';
    try {
      var raw = await openWithPassword(S.vault, pw.input.value);
      VAULT.key = await dekFrom(raw); S.fails = 0; finishUnlock(); return;
    } catch (x) {
      S.fails++; pw.input.value = '';
      var wait = S.fails >= 3 ? Math.min(30, Math.pow(2, S.fails - 2)) : 0;
      err.textContent = 'That password is not right.' + (wait ? ' Wait ' + wait + ' seconds before trying again.' : '');
      if (wait) until = Date.now() + wait * 1000;
    }
    go.disabled = false; go.textContent = 'Unlock'; pw.input.focus();
  });
  lockEl.replaceChildren(form); lockEl.hidden = false; pw.input.focus();
}
function showRecover(){
  var code = h('input', {id: 'rec-code', type: 'text', autocomplete: 'off', spellcheck: 'false', autocapitalize: 'characters', placeholder: 'XXXX-XXXX-XXXX-XXXX-XXXX-XXXX'});
  var np = pwField('rec-new', 'New password (at least 10 characters)', 'new-password');
  var nc = pwField('rec-conf', 'Repeat the new password', 'new-password');
  var err = h('p', {class: 'err', role: 'alert'});
  var go = h('button', {class: 'btn primary', type: 'submit'}, 'Reset password');
  var form = h('form', {class: 'lockbox'},
    h('span', {class: 'mark'}, icon('lock')), h('h1', {text: 'Reset password'}),
    h('p', {class: 'hint', text: 'Enter the recovery code you saved when you turned on the password.'}),
    h('div', {class: 'field'}, h('label', {for: 'rec-code', text: 'Recovery code'}), code),
    np.wrap, meterFor(np.input), nc.wrap, err, go,
    h('button', {class: 'btn', type: 'button', onclick: showUnlock}, 'Back'));
  form.addEventListener('submit', async function(e){
    e.preventDefault(); err.textContent = '';
    if (np.input.value.length < 10) { err.textContent = 'Use at least 10 characters for the new password.'; return; }
    if (np.input.value !== nc.input.value) { err.textContent = 'The two passwords do not match.'; return; }
    go.disabled = true; go.textContent = 'Checking...';
    var raw;
    try { raw = await openWithCode(S.vault, code.value); }
    catch (x) { err.textContent = 'That recovery code is not right.'; go.disabled = false; go.textContent = 'Reset password'; return; }
    try {
      var m2 = await rewrapPassword(S.vault, raw, np.input.value);
      await store.setMeta(m2); S.vault = m2; VAULT.key = await dekFrom(raw); S.fails = 0; finishUnlock(); toast('Password reset');
    } catch (x) { err.textContent = "Couldn't save the new password. Check your connection and try again."; go.disabled = false; go.textContent = 'Reset password'; }
  });
  lockEl.replaceChildren(form); lockEl.hidden = false; code.focus();
}
function lockSession(){
  if (!S.vault || S.locked) return;
  VAULT.key = null; S.locked = true; S.records = []; S.loaded = false; seq++;
  renderAll(); showUnlock();
}
function showRetry(){
  $('#app').hidden = true;
  var go = h('button', {class: 'btn primary', type: 'button', onclick: function(){ go.disabled = true; bootMeta(); }}, 'Try again');
  lockEl.replaceChildren(h('div', {class: 'lockbox'}, h('span', {class: 'mark'}, icon('lock')), h('h1', {text: 'My Records'}),
    h('p', {class: 'hint', text: "Couldn't check your security settings. Check your connection and try again."}), go));
  lockEl.hidden = false;
}
function bootMeta(){
  store.getMeta().then(function(m){
    S.vault = m || null; S.metaReady = true; setStatus();
    if (S.vault) { S.locked = true; showUnlock(); }
    else { lockEl.hidden = true; lockEl.replaceChildren(); $('#app').hidden = false; processRaw(); }
  }).catch(function(){ showRetry(); });
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 120000 && S.vault && !S.locked) lockSession();
});

/* ---------- theme ---------- */
function effectiveDark(){
  var t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function themeIcon(){ var b = $('#themeBtn'); b.replaceChildren(icon(effectiveDark() ? 'sun' : 'moon')); }
function initTheme(){
  try { var t = localStorage.getItem('mr_theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  themeIcon();
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', themeIcon);
  }
}

/* ---------- wiring ---------- */
$('#mark').appendChild(icon('sheets'));
$('#sIc').appendChild(icon('search'));
$('#menuBtn').appendChild(icon('more'));
$('#fab').appendChild(icon('plus'));
$('#fab').appendChild(document.createTextNode('New'));
$('#themeBtn').addEventListener('click', function(){
  var next = effectiveDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('mr_theme', next); } catch (e) {}
  themeIcon();
});
$('#menuBtn').addEventListener('click', function(e){ S.opener = e.currentTarget; settings(); });
$('#fab').addEventListener('click', function(e){ if (needStore()) { S.opener = e.currentTarget; chooser(); } });
$('#q').addEventListener('input', function(e){ S.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', function(e){ S.sort = e.target.value; renderList(); });

async function start(){
  initTheme();
  renderAll(); setStatus();
  loadTimer = setTimeout(function(){ if (!S.loaded) { S.slow = true; renderList(); } }, 10000);
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function(x){ DL = x || null; }).catch(function(){ DL = null; });
  }
  store = await initStore();
  setStatus();
  store.subscribe(onRows, onErr);
  bootMeta();
}
start();
})();
</script>
